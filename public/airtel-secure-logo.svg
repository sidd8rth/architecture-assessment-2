<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none">
  <!-- Airtel swoosh brand mark: stylized curved 'a' shape -->
  <g fill="#2D3748">
    <!-- Outer rounded teardrop shape -->
    <path d="M 38 8
             C 18 8, 4 24, 4 44
             C 4 64, 18 80, 38 80
             C 50 80, 60 74, 66 64
             L 70 56
             C 72 52, 74 46, 74 40
             C 74 22, 60 8, 38 8 Z
             M 38 22
             C 52 22, 60 32, 60 42
             C 60 50, 56 56, 50 60
             L 38 66
             C 26 66, 18 56, 18 44
             C 18 32, 26 22, 38 22 Z"
          fill-rule="evenodd"/>
    <!-- Inner tail (the curl that gives the 'a' its character) -->
    <path d="M 50 58
             C 46 64, 38 68, 32 66
             C 26 64, 24 58, 28 54
             L 42 46
             C 46 44, 50 46, 50 50
             Z"/>
  </g>
  <!-- "Secure" wordmark -->
  <text x="92" y="58"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="38"
        font-weight="500"
        fill="#2D3748"
        letter-spacing="-0.5">Secure</text>
</svg>
